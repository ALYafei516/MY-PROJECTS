<div style="background-color: #164a6d; color: white; padding: 15px; text-align: center; font-size: 40px;">
    Job Application Form
</div>

<br>

<div class="container text-center">
    <div class="row">
        <div class="col-1"></div>
        <div class="col-10">
            <!-- Success and Error Messages -->
            <div *ngIf="submissionSuccess === false" class="alert alert-danger">
                There was an error with the submission. Please check required fields.
            </div>
            <div *ngIf="submissionSuccess === true" class="alert alert-success">
                Form submitted successfully!
            </div>

            <form style="text-align: left;" #form="ngForm" (ngSubmit)="onSubmit(form)">
                <h2 style="color: rgb(6, 149, 193);">Personal Information</h2>
                <hr>
                
                <!-- Personal Information Fields -->
                <div class="mb-3" style="display: flex; gap: 20px;">
                  <div>
                    <label>Full Name</label><br>
                    <input style="width: 350px;" class="form-control form-control-lg" placeholder="Name"
                           name="name" [(ngModel)]="service.formData.name" required>
                  </div>
                  <div>
                    <label>Email</label><br>
                    <input style="width: 350px;" class="form-control form-control-lg" placeholder="Email"
                           name="email" [(ngModel)]="service.formData.email" required>
                  </div>
                  <div>
                    <label>Mobile</label><br>
                    <input style="width: 350px;" class="form-control form-control-lg" placeholder="Mobile"
                           name="phone" [(ngModel)]="service.formData.phone" required>
                  </div>
                </div>
                
                <label>LinkedIn URL</label><br>
                <input style="width: 1090px;" class="form-control form-control-lg" placeholder="LinkedIn URL"
                       name="linkedin" [(ngModel)]="service.formData.linkedin" required>
                
                <!-- Work Experiences Section -->
                <h2 style="color: rgb(6, 149, 193);">Work Experiences</h2>
                <hr>
                
                <div *ngFor="let job of workExperiences; let i = index" class="mb-3">
                  <div style="display: flex; gap: 20px;">
                    <div>
                      <label>Job Title</label><br>
                      <input style="width: 530px;" class="form-control form-control-lg"
                             [(ngModel)]="job.title" name="jobTitle{{i}}" required>
                    </div>
                    <div>
                      <label>Company Name</label><br>
                      <input style="width: 530px;" class="form-control form-control-lg"
                             [(ngModel)]="job.company" name="companyName{{i}}" required>
                    </div>
                  </div>
                  <div style="display: flex; gap: 20px; margin-top: 10px;">
                    <div>
                      <label>From Period</label><br>
                      <input type="date" style="width: 300px;" class="form-control form-control-lg"
                             [(ngModel)]="job.from" name="fromPeriod{{i}}" required>
                    </div>
                    <div>
                      <label>To Period</label><br>
                      <input type="date" style="width: 300px;" class="form-control form-control-lg"
                             [(ngModel)]="job.to" name="toPeriod{{i}}" required>
                    </div>
                    <div>
                      <label>Salary</label><br>
                      <input style="width: 300px;" class="form-control form-control-lg"
                             [(ngModel)]="job.salary" name="salary{{i}}">
                    </div>
                  </div>
                  
                  <div class="d-flex gap-2 mt-3">
                    <button type="button" class="btn btn-primary" (click)="addJob()">Add New</button>
                    <button *ngIf="workExperiences.length > 1" type="button" class="btn btn-danger" (click)="removeJob(i)">Delete</button>
                  </div>
                  <hr>
                </div>
              
                <!-- Courses Section -->
                <h2 style="color: rgb(6, 149, 193);">Courses</h2>
                <hr>
                <div *ngFor="let course of courses; let i = index" class="mb-3">
                  <div style="display: flex; gap: 20px;">
                    <div>
                      <label>Course Name</label><br>
                      <input style="width: 530px;" class="form-control form-control-lg"
                             [(ngModel)]="course.name" name="courseName{{i}}" required>
                    </div>
                    <div>
                      <label>Course Center</label><br>
                      <input style="width: 530px;" class="form-control form-control-lg"
                             [(ngModel)]="course.center" name="courseCenter{{i}}" required>
                    </div>
                  </div>
                  <div style="display: flex; gap: 20px; margin-top: 10px;">
                    <div>
                      <label>From Period</label><br>
                      <input type="date" style="width: 300px;" class="form-control form-control-lg"
                             [(ngModel)]="course.from" name="courseFrom{{i}}" required>
                    </div>
                    <div>
                      <label>To Period</label><br>
                      <input type="date" style="width: 300px;" class="form-control form-control-lg"
                             [(ngModel)]="course.to" name="courseTo{{i}}" required>
                    </div>
                  </div>
              
                  <div class="d-flex gap-2 mt-3">
                    <button type="button" class="btn btn-primary" (click)="addCourse()">Add New Course</button>
                    <button *ngIf="courses.length > 1" type="button" class="btn btn-danger" (click)="removeCourse(i)">Delete</button>
                  </div>
                  <hr>
                </div>
                
                <div class="d-grid mt-4">
                  <button class="btn btn-lg btn-success" type="submit">Submit</button>
                </div>
              </form>
              
        </div>
    </div>
</div>
